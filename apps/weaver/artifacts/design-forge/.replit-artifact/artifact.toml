kind = "web"
previewPath = "/"
title = "Design System Forge"
version = "1.0.0"
id = "artifacts/design-forge"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18878

[services.development]
run = "pnpm --filter @workspace/design-forge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/design-forge", "run", "build" ]
serve = "static"
publicDir = "artifacts/design-forge/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18878"
BASE_PATH = "/"
